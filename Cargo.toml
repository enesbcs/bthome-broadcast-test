[package]
name = "bthome-broadcast-test"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "BTHome Temperature Broadcaster: standalone BTHome v2 BLE temperature broadcaster (CPU -> GPU -> disk -> ACPI -> weather -> test data)"

[lib]
name = "bthome_broadcast_test"
path = "src/lib.rs"

[[bin]]
name = "bthome-broadcast-test"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Only the service side (object server + #[interface]) and the blocking
# runtime are needed; the proxy and tracing features would only grow the binary.
zbus = { version = "6.2", default-features = false, features = ["default-rt", "service"] }

[target.'cfg(target_os = "windows")'.dependencies]
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["native-tls"] }
windows = { version = "0.62", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "System_UserProfile",
] }
nvml-wrapper = "0.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
